name: PERKY branch verification
on:
  push:
    branches: [perky-machines]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perky-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    name: DSP toolchain and PERKY gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: make ci-dsp
      - run: python3 tools/verify/verify_perky_simple_drum_control.py
      - run: python3 tools/verify/verify_perky_simple_drum_tables.py
      - run: python3 tools/verify/verify_perky_simple_drum_runtime_tables.py
      - run: python3 tools/verify/verify_perky_simple_drum_transport.py
      - run: python3 tools/verify/verify_perky_simple_drum_live.py
      - run: python3 tools/verify/verify_perky_simple_drum_compact.py
      - run: python3 tools/verify/verify_perky_simple_drum_frequency_exec.py
      - run: python3 tools/verify/verify_perky_simple_drum_oscillator_exec.py
